name: Build GRAIN GUARD ESP8266

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Prepare LittleFS web files
        run: |
          rm -rf data
          mkdir -p data
          cp index.html data/index.html
          cp style.css data/style.css
          cp script.js data/script.js
          sed -i 's/NODEMCU_URL: ""/NODEMCU_URL: window.location.origin/' data/script.js

      - name: Build firmware
        run: pio run

      - name: Build LittleFS filesystem
        run: pio run -t buildfs

      - name: Upload firmware and LittleFS BINs
        uses: actions/upload-artifact@v4
        with:
          name: GRAIN-GUARD-ESP8266-LOCAL
          path: |
            .pio/build/nodemcuv2/firmware.bin
            .pio/build/nodemcuv2/littlefs.bin
          if-no-files-found: error
