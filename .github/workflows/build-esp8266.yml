name: Build NEO-6M GPS ESP8266

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Compile ESP8266 firmware
        run: pio run

      - name: Collect flash files
        run: |
          mkdir -p output
          cp .pio/build/nodemcuv2/firmware.bin output/firmware.bin
          cp .pio/build/nodemcuv2/firmware.elf output/firmware.elf

      - name: Upload compiled firmware
        uses: actions/upload-artifact@v4
        with:
          name: NEO6M-NodeMCU-Firmware
          path: output/
          if-no-files-found: error
